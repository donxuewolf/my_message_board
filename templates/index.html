<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的留言板</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            box-sizing: border-box;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #2980b9; }
        .msg-list {
            list-style: none;
            padding: 0;
        }
        .msg-item {
            background: #f9f9f9;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>✍️ 我的简易留言板</h2>
        
        <!-- 留言表单：method="POST" 把数据传给后端 -->
        <form method="POST">
            <textarea name="content" placeholder="写下你想说的话..." required></textarea><br>
            <button type="submit">发表留言</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <h3>💬 大家都在说：</h3>
        <ul class="msg-list">
            <!-- 遍历后端传过来的 messages 列表 -->
            {% for msg in messages %}
                <li class="msg-item">{{ msg.content }}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
